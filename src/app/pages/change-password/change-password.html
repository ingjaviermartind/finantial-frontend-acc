<div class="password-container">
    <h2>Cambiar contraseña</h2>
    <label>Contraseña actual</label>
    <input
        type="password"
        [(ngModel)]="currentPassword">
    <label>Nueva contraseña</label>
    <div class="password-field">
        <input
            [type]="showNewPassword ? 'text' : 'password'"
            [(ngModel)]="newPassword">
        <button
            type="button"
            class="eye-button"
            (mousedown)="showNewPassword = true"
            (mouseup)="showNewPassword = false"
            (mouseleave)="showNewPassword = false"
            (touchstart)="showNewPassword = true"
            (touchend)="showNewPassword = false">

            <span class="material-symbols-outlined">
                visibility
            </span>
        </button>
    </div>
    <label>Confirmar contraseña</label>
    <div class="password-field">
    <input
        [type]="showConfirmPassword ? 'text' : 'password'"
        [(ngModel)]="confirmPassword">
    <button
        type="button"
        class="eye-button"
        (mousedown)="showConfirmPassword = true"
        (mouseup)="showConfirmPassword = false"
        (mouseleave)="showConfirmPassword = false"
        (touchstart)="showConfirmPassword = true"
        (touchend)="showConfirmPassword = false">

        <span class="material-symbols-outlined">
            visibility
        </span>
    </button>
    </div>
    <button
        (click)="changePassword()"
        [disabled]="isLoading">
        {{ isLoading ? 'Guardando...' : 'Cambiar contraseña' }}
    </button>
</div>
