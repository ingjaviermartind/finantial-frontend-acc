<aside
  class="feasibility-sidebar"
  [class.expanded]="isExpanded">

  <!-- PESTAÑA -->
  <button
    class="sidebar-toggle"
    type="button"
    (click)="toggleSidebar()"
    [attr.aria-label]="isExpanded ? 'Cerrar menú' : 'Abrir menú'">

    {{ isExpanded ? '‹' : '›' }}

  </button>


  <div class="sidebar-inner">

    <!-- HEADER -->
    <div class="sidebar-header">

      <span class="sidebar-title">
        Preventa
      </span>

      @if (isExpanded) {
        <span class="sidebar-subtitle">
          Viabilizaciones de Funnels
        </span>
      }

    </div>


    <!-- NAVEGACIÓN -->
    <nav class="sidebar-nav">

      <a
        routerLink="/feasibility/upload"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">

        <span class="step">1</span>

        @if (isExpanded) {
          <span class="link-text">
            Cargar información
          </span>
        }

      </a>


      <a
        routerLink="/feasibility/viability"
        routerLinkActive="active">

        <span class="step">2</span>

        @if (isExpanded) {
          <span class="link-text">
            Viabilización
          </span>
        }

      </a>


      <a
        routerLink="/feasibility/costs"
        routerLinkActive="active">

        <span class="step">3</span>

        @if (isExpanded) {
          <span class="link-text">
            Costos
          </span>
        }

      </a>


      <a
        routerLink="/feasibility/export"
        routerLinkActive="active">

        <span class="step">4</span>

        @if (isExpanded) {
          <span class="link-text">
            Exportar
          </span>
        }

      </a>

    </nav>

  </div>

</aside>
